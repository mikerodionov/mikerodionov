name: Generate Language Metrics
on:
  schedule:
    # Offset by 17 minutes to bypass the midnight GitHub Actions traffic jam
    - cron: "17 0 * * *"
  workflow_dispatch:
  push: 
    branches: ["master", "main"]
    # CRITICAL: Prevents the action from re-triggering itself when it commits the SVG
    paths-ignore:
      - 'assets/**'

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: mikerodionov
          template: classic
          base: "" 
          filename: assets/metrics.plugin.languages.svg
          config_timezone: UTC
          config_display: large
          plugin_languages: yes
          plugin_languages_ignored: html, jupyter notebook
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 10
