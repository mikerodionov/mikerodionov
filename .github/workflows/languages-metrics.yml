name: Generate Language Metrics
on:
  schedule:
    # Runs at 00:00 UTC everyday
    - cron: "0 0 * * *"
  workflow_dispatch:
  # (Optional) Run on push to main/master to update immediately
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          # --- Authentication ---
          token: ${{ secrets.METRICS_TOKEN }}

          # --- Output Configuration ---
          user: mikerodionov
          template: classic
          base: "" # Empty base to avoid a full profile summary (header, avatar, etc.)
          filename: assets/metrics.plugin.languages.icons.svg
          config_timezone: UTC
          
          # --- Languages Plugin Configuration ---
          plugin_languages: yes
          # Ignore languages as requested previously
          plugin_languages_ignored: html, jupyter notebook
          # CRITICAL: Displays only icons, not percentages
          plugin_languages_details: icons 
          plugin_languages_limit: 10
